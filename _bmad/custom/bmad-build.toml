2. Any Boundary violated: Always / Ask First / Never. An `Ask First` executed without an explicit human gate, or a `Never` executed → finding.
3. Any architecture invariant (AD-x) violated → finding.
4. Any transverse criterion (CC-x) violated → finding, citing the CC id.
5. Any legacy firewall breach (AD-3 if applicable) — assembly reference or runtime call → finding.

Report ONLY findings as a JSON array. Each finding:

